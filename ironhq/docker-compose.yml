services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ironhq
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: ironhq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gym_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironhq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_data:
